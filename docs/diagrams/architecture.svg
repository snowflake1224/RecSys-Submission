<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-label="CADM Dual-Memory Conversational Book Recommender Architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#121a35"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <style>
      .t { font: 700 20px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f8fafc; }
      .s { font: 400 12px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
      .zone { fill: #131c36; stroke: #293b66; stroke-width: 1.5; rx: 14; }
      .zl { font: 700 11px 'Inter', 'Segoe UI', system-ui, sans-serif; letter-spacing: 0.08em; fill: #818cf8; text-transform: uppercase; }
      .box { fill: #1b284c; stroke: #6366f1; stroke-width: 1.3; rx: 10; }
      .box-mem { fill: #122c34; stroke: #10b981; stroke-width: 1.4; rx: 10; }
      .box-warn { fill: #252042; stroke: #f59e0b; stroke-width: 1.4; rx: 10; }
      .bt { font: 600 13px 'Inter', 'Segoe UI', system-ui, sans-serif; fill: #f1f5f9; }
      .bs { font: 400 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .e { stroke: #38bdf8; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .ed { stroke: #f59e0b; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1120" height="600" fill="url(#bg)"/>
  <text x="34" y="40" class="t">CADM  Contradiction-Aware Dual-Memory Conversational Recommender</text>
  <text x="34" y="60" class="s">RecSys 2026 Co-Authored Manuscript · Goodreads Book Graph · +16.2% NDCG@10 (0.365 vs 0.314) &amp; 33% Fewer Turns</text>

  <!-- Row 1: Dialogue & Dual Memory -->
  <rect x="34" y="84" width="1052" height="162" class="zone"/>
  <text x="50" y="106" class="zl">1. Dialogue Preference Extraction &amp; Contradiction Routing</text>
  <rect x="52" y="122" width="240" height="106" class="box"/>
  <text x="68" y="144" class="bt">Turn Query &amp; Extractor</text>
  <text x="68" y="164" class="bs">User turn q_t -&gt;</text>
  <text x="68" y="181" class="bs">pi_t = (attr, val, conf)</text>
  <text x="68" y="198" class="bs">Genre · tone · author · pace</text>

  <rect x="320" y="122" width="230" height="106" class="box-mem"/>
  <text x="336" y="144" class="bt">Long-Term Memory (M^L)</text>
  <text x="336" y="164" class="bs">Stable reader taste profile</text>
  <text x="336" y="181" class="bs">Confidence decay gamma=0.95</text>
  <text x="336" y="198" class="bs">Author/pacing shifts persist</text>

  <rect x="578" y="122" width="230" height="106" class="box-warn"/>
  <text x="594" y="144" class="bt">Session Buffer (M^S)</text>
  <text x="594" y="164" class="bs">Sliding window (W = 12 turns)</text>
  <text x="594" y="181" class="bs">Transient in-session overrides</text>
  <text x="594" y="198" class="bs">Isolates tone/genre pivots</text>

  <rect x="836" y="122" width="232" height="106" class="box-warn"/>
  <text x="852" y="144" class="bt">Contradiction &amp; EIG Gate</text>
  <text x="852" y="164" class="bs">cos(e_vi, e_v) &lt; 0.35 -&gt; M^S</text>
  <text x="852" y="181" class="bs">Adaptive EIG &gt; 0.70 -&gt;</text>
  <text x="852" y="198" class="bs">ask clarifying question c_t</text>

  <!-- Row 2: Hybrid Retrieval & LambdaRank -->
  <rect x="34" y="272" width="1052" height="156" class="zone"/>
  <text x="50" y="294" class="zl">2. Hybrid Retrieval &amp; 16-Feature LightGBM LambdaRank</text>
  <rect x="52" y="310" width="320" height="98" class="box"/>
  <text x="68" y="332" class="bt">Dense HNSW + Lexical TF-IDF</text>
  <text x="68" y="352" class="bs">BGE-small-en-v1.5 (384d, M=32, ef=200)</text>
  <text x="68" y="369" class="bs">Sublinear TF-IDF (100K features)</text>
  <text x="68" y="386" class="bs">s_hyb = 0.6*s_sem + 0.4*s_lex (top-250)</text>

  <rect x="400" y="310" width="336" height="98" class="box"/>
  <text x="416" y="332" class="bt">Feature Extraction (16 Features)</text>
  <text x="416" y="352" class="bs">Semantic: title/desc/combined cosine</text>
  <text x="416" y="369" class="bs">ALS CF similarity + popularity/rating</text>
  <text x="416" y="386" class="bs">Structural (series/author) + memory compat</text>

  <rect x="764" y="310" width="304" height="98" class="box-mem"/>
  <text x="780" y="332" class="bt">LightGBM LambdaRank</text>
  <text x="780" y="352" class="bs">700 rounds · early stopping (80)</text>
  <text x="780" y="369" class="bs">Graded relevance label_gain [0, 1, 3]</text>
  <text x="780" y="386" class="bs">Reranks top-250 -&gt; Top-K items</text>

  <!-- Row 3: Quantitative Evidence -->
  <rect x="34" y="454" width="1052" height="118" class="zone"/>
  <text x="50" y="476" class="zl">3. Manuscript Results Ladder (Goodreads Book Graph)</text>
  <rect x="52" y="492" width="1016" height="62" class="box"/>
  <text x="72" y="516" class="bs">Random (0.018) -&gt; CF-only (0.178) -&gt; Sem-only (0.224) -&gt; Hybrid (0.271) -&gt; Hybrid+LTR (0.314) -&gt; CADM Full (0.365 NDCG@10)</text>
  <text x="72" y="538" class="bs" fill="#34d399">Notebook retrieval eval (28,886 Goodreads queries): Hybrid+LTR raises NDCG@10 from 0.4366 to 0.6618 · Adaptive EIG cuts avg turns 4.9 -&gt; 3.2</text>

  <path d="M 292 175 L 320 175" class="e"/>
  <path d="M 550 175 L 578 175" class="e"/>
  <path d="M 808 175 L 836 175" class="e"/>
  <path d="M 435 228 L 212 310" class="e"/>
  <path d="M 693 228 L 280 310" class="ed"/>
  <path d="M 372 359 L 400 359" class="e"/>
  <path d="M 736 359 L 764 359" class="e"/>
  <path d="M 916 408 L 560 492" class="e"/>
</svg>
